<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>주변보기 | 건마타운</title>
    <style>
      :root {
        --purple: #667eea;
        --purple-2: #764ba2;
        --line: #e8e8ee;
        --text: #222;
        --muted: #6b7280;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
        color: var(--text);
        background: #f3f4f6;
      }
      .app {
        max-width: 490px;
        margin: 0 auto;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: #fff;
      }
      header.top {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 14px;
        color: #fff;
        background: linear-gradient(135deg, var(--purple) 0%, var(--purple-2) 100%);
      }
      header.top a {
        color: #fff;
        text-decoration: none;
        font-weight: 800;
        font-size: 1.05rem;
      }
      header.top .gps-btn {
        border: 1px solid rgba(255,255,255,.55);
        background: rgba(255,255,255,.18);
        color: #fff;
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 0.78rem;
        font-weight: 700;
        cursor: pointer;
      }
      .status {
        flex: 0 0 auto;
        padding: 6px 14px;
        font-size: 0.78rem;
        color: #374151;
        background: #f8f9ff;
        border-bottom: 1px solid var(--line);
      }
      nav.cats {
        flex: 0 0 auto;
        display: flex;
        gap: 0;
        overflow-x: auto;
        border-bottom: 1px solid var(--line);
        background: #fff;
        -webkit-overflow-scrolling: touch;
      }
      nav.cats button {
        flex: 1 0 auto;
        min-width: 64px;
        border: 0;
        background: none;
        padding: 12px 8px 10px;
        font-size: 0.86rem;
        font-weight: 700;
        color: #888;
        cursor: pointer;
        border-bottom: 2px solid transparent;
      }
      nav.cats button.active {
        color: var(--purple);
        border-bottom-color: var(--purple);
      }
      .filters {
        flex: 0 0 auto;
        display: flex;
        gap: 6px;
        padding: 8px 12px;
        overflow-x: auto;
        border-bottom: 1px solid var(--line);
      }
      .filters button {
        flex: 0 0 auto;
        border: 1px solid #e9ecef;
        background: #f8f9fa;
        color: #555;
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 0.8rem;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
      }
      .filters button.active {
        background: var(--purple);
        border-color: var(--purple);
        color: #fff;
      }
      .theme-filter-section {
        flex: 0 0 auto;
        padding: 8px 12px 10px;
        background: #f8f9fa;
        border-bottom: 1px solid var(--line);
      }
      .theme-filter-section[hidden] { display: none !important; }
      .theme-boxes {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
      .theme-box {
        background: #fff;
        border: 1.5px solid #e9ecef;
        border-radius: 10px;
        padding: 8px 4px;
        text-align: center;
        cursor: pointer;
      }
      .theme-box.active {
        border-color: #e91e63;
        background: #fdf2f8;
      }
      .theme-name {
        font-size: 0.72rem;
        font-weight: 700;
        color: #333;
        line-height: 1.2;
      }
      .map-wrap {
        position: relative;
        flex: 0 0 45vh;
        height: 45vh;
      }
      #map {
        height: 100%;
        width: 100%;
        background: #dbe4f0;
      }
      .shop-list {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 10px 12px 24px;
        background: #f5f6f8;
      }
      .shop-list h2 {
        margin: 4px 0 10px;
        font-size: 0.92rem;
      }
      .shop-card {
        display: flex;
        flex-direction: row;
        width: 100%;
        text-align: left;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
        margin: 0 0 10px;
        cursor: pointer;
        box-shadow: 0 2px 12px rgba(0,0,0,.08);
      }
      .shop-card.is-selected {
        border-color: var(--purple);
        box-shadow: 0 0 0 2px rgba(102,126,234,.25);
      }
      .shop-card .card-image {
        width: 92px;
        height: 118px;
        flex-shrink: 0;
        background: #eee;
        overflow: hidden;
      }
      .shop-card .card-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .shop-card .card-body {
        flex: 1;
        min-width: 0;
        padding: 8px 10px 9px 12px;
      }
      .shop-card .row1 {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }
      .shop-card h3 {
        display: flex;
        align-items: center;
        gap: 5px;
        min-width: 0;
        flex: 1;
        margin: 0;
        font-size: 0.98rem;
        font-weight: 800;
      }
      .shop-card .card-flags {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        flex-shrink: 0;
      }
      .shop-card .card-flags img {
        height: 1em;
        width: 1.5em;
        object-fit: cover;
        border-radius: 1px;
        display: block;
      }
      .shop-card .card-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .shop-card .km {
        color: var(--purple);
        font-weight: 800;
        font-size: 0.82rem;
        white-space: nowrap;
      }
      .shop-card p {
        margin: 3px 0 0;
        font-size: 0.8rem;
        color: var(--muted);
        line-height: 1.35;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .shop-card .detail-addr {
        color: #374151;
        font-weight: 600;
      }
      .shop-card .price {
        color: #111;
        font-weight: 800;
        font-size: 0.9rem;
      }
      .shop-card .price-label {
        font-size: 0.72rem;
        color: #888;
        font-weight: 700;
        margin-right: 4px;
      }
      .map-label img,
      .pick-row img {
        width: 22px;
        height: 14px;
        object-fit: cover;
        border-radius: 2px;
        flex-shrink: 0;
      }
      .empty {
        padding: 24px 8px;
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .map-pin {
        position: relative;
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        padding-bottom: 6px;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,.2));
        pointer-events: auto;
      }
      .map-label {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        max-width: 210px;
        padding: 6px 10px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        font-size: 12px;
        line-height: 1.2;
        white-space: nowrap;
        cursor: pointer;
      }
      .map-label.is-selected {
        border-color: var(--purple);
        box-shadow: 0 0 0 2px rgba(102,126,234,.35);
      }
      .map-label .map-name {
        font-weight: 800;
        max-width: 110px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .map-label .map-price {
        font-weight: 800;
        color: #e11d48;
      }
      .map-cluster {
        min-width: 34px;
        height: 34px;
        padding: 0 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #667eea;
        color: #fff;
        border: 2px solid #fff;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
      }
      .map-cluster.is-selected {
        box-shadow: 0 0 0 2px rgba(102,126,234,.45);
      }
      .map-pin::after {
        content: "";
        width: 0;
        height: 0;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-top: 10px solid #fff;
        margin-top: -1px;
      }
      .map-pin--cluster::after {
        border-top-color: #667eea;
      }
      .map-pin::before {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 10px;
        height: 10px;
        margin-left: -5px;
        background: #667eea;
        border: 2px solid #fff;
        border-radius: 50%;
        box-shadow: 0 1px 3px rgba(0,0,0,.3);
        z-index: 2;
      }
      .map-label-icon {
        background: none !important;
        border: none !important;
        overflow: visible !important;
      }
      .overlap-picker {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 8px;
        max-height: 42%;
        overflow: auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,.2);
        z-index: 500;
      }
      .overlap-picker[hidden] { display: none !important; }
      .picker-title {
        padding: 10px 12px 6px;
        font-size: 0.82rem;
        font-weight: 700;
        color: #444;
        border-bottom: 1px solid #eee;
      }
      .pick-row {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        border: 0;
        border-bottom: 1px solid #f3f4f6;
        background: #fff;
        padding: 9px 12px;
        text-align: left;
        cursor: pointer;
      }
      .pick-row:last-child { border-bottom: 0; }
      .pick-row:hover { background: #f8f9ff; }
      .pick-name {
        flex: 1;
        min-width: 0;
        font-weight: 800;
        font-size: 0.88rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pick-price {
        color: #e11d48;
        font-weight: 800;
        font-size: 0.82rem;
        white-space: nowrap;
      }
      .help {
        margin: 0 0 10px;
        padding: 10px 12px;
        background: #fff7ed;
        border: 1px solid #fed7aa;
        border-radius: 10px;
        font-size: 0.8rem;
        color: #9a3412;
      }
      .my-dot {
        width: 16px;
        height: 16px;
        background: #2563eb;
        border: 3px solid #fff;
        border-radius: 50%;
        box-shadow: 0 0 0 6px rgba(37,99,235,.25);
      }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">

        <button type="button" class="gps-btn" id="gpsBtn">내 위치</button>

    <script src="js/shop-card-data.js"></script>
    <script>
      /* 카카오 JavaScript 키. 발급 후 아래 값을 교체하세요.
         1) https://developers.kakao.com 앱 생성
         2) 앱 키 → JavaScript 키 복사
         3) 플랫폼 → Web → 사이트 도메인에 https://gunmatown.com 과 http://localhost:5500 등록
         REST 키는 geocode.py 전용입니다. */
      const KAKAO_JS_KEY = "818ce0b08043e64115b800bc56f88c34";
      const SEOUL_STATION = { lat: 37.5546, lng: 126.9706 };
      const AUTH_API_BASE = (() => {
        try {
          return localStorage.getItem("gunmatown-api-base") || "https://gunmatown-api.pages.dev";
        } catch {
          return "https://gunmatown-api.pages.dev";
        }
      })();

      const state = {
        engine: null,
        my: { ...SEOUL_STATION, source: "default" },
        place: null,
        shops: [],
        cat: "all",
        km: "all",
        theme: "all",
        themeOpen: false,
        selectedId: null,
      };
      const THEME_KEYWORDS = {
        swedish: ["스웨디시", "스웨덴"],
        thai: ["타이마사지", "타이", "thai"],
        aroma: ["아로마", "아로마마사지", "에센셜"],
        waxing: ["왁싱", "waxing", "브라질리언", "제모"],
        chinese: ["중국마사지", "중국", "지압"],
        foot: ["발마사지", "족욕", "풋케어", "풋마사지"],
        spa: ["스파", "SPA", "스크럽"],
      };

      function toRad(v) { return (v * Math.PI) / 180; }
      function haversineKm(aLat, aLng, bLat, bLng) {
        const R = 6371;
        const dLat = toRad(bLat - aLat);
        const dLng = toRad(bLng - aLng);
        const h =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(toRad(aLat)) * Math.cos(toRad(bLat)) * Math.sin(dLng / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
      }
      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function hasCoords(s) {
        const lat = Number(s.lat);
        const lng = Number(s.lng);
        return Number.isFinite(lat) && Number.isFinite(lng);
      }
      function countryBlob(shop) {
        return String(shop.country || "").toLowerCase();
      }
      const FLAG_MAP = [
        { key: "korea", re: /korea|한국/, src: "images/national flag/한국.jpg", alt: "한국" },
        { key: "china", re: /china|중국/, src: "images/national flag/중국.jpg", alt: "중국" },
        { key: "thailand", re: /thailand|thai|태국/, src: "images/national flag/태국.jpg", alt: "태국" },
        { key: "japan", re: /japan|일본/, src: "images/national flag/일본.jpg", alt: "일본" },
        { key: "russia", re: /russia|러시아/, src: "images/national flag/러시아.jpg", alt: "러시아" },
        { key: "ukraine", re: /ukraine|우크라이나/, src: "images/national flag/우크라이나국기.png", alt: "우크라이나" },
      ];
      function countryFlags(shop) {
        const blob = countryBlob(shop);
        const hits = FLAG_MAP.filter((f) => f.re.test(blob));
        return hits.length ? hits : [FLAG_MAP[0]];
      }
      function flagImgs(shop) {
        return countryFlags(shop)
          .map((f) => `<img src="${f.src}" alt="${esc(f.alt)}">`)
          .join("");
      }
      function locationText(shop) {
        return [shop.district, shop.dong].filter(Boolean).join(" ") || shop.region || "";
      }

      function labelInnerHtml(shop, selected) {
        return `<div class="map-pin">
          <div class="map-label${selected ? " is-selected" : ""}">
            <span class="map-flags">${flagImgs(shop)}</span>
            <span class="map-name">${esc(shop.name)}</span>
            <span class="map-price">${esc(shop.price || "")}</span>
          </div>
        </div>`;
      }
      function clusterInnerHtml(group, selectedId) {
        const selected = group.some((s) => String(s.id) === String(selectedId));
        if (group.length === 1) return labelInnerHtml(group[0], selected);
        return `<div class="map-pin map-pin--cluster">
          <div class="map-cluster${selected ? " is-selected" : ""}">+${group.length}</div>
        </div>`;
      }
      const OVERLAP_M = 45;
      function groupOverlapping(shops) {
        const used = new Set();
        const groups = [];
        for (let i = 0; i < shops.length; i++) {
          if (used.has(i)) continue;
          const g = [shops[i]];
          used.add(i);
          for (let j = i + 1; j < shops.length; j++) {
            if (used.has(j)) continue;
            const m =
              haversineKm(
                Number(shops[i].lat),
                Number(shops[i].lng),
                Number(shops[j].lat),
                Number(shops[j].lng)
              ) * 1000;
            if (m <= OVERLAP_M) {
              g.push(shops[j]);
              used.add(j);
            }
          }
          groups.push(g);
        }
        return groups;
      }
      function closeOverlapPicker() {
        const box = document.getElementById("overlapPicker");
        if (box) box.hidden = true;
      }
      function openOverlapPicker(group) {
        const box = document.getElementById("overlapPicker");
        const title = document.getElementById("pickerTitle");
        const list = document.getElementById("pickerList");
        if (!box || !list) return;
        title.textContent = `이 위치 ${group.length}곳 · 선택할 업체를 누르세요`;
        list.innerHTML = group
          .map(
            (s) => `<button type="button" class="pick-row" data-id="${esc(s.id)}">
              ${flagImgs(s)}
              <span class="pick-name">${esc(s.name)}</span>
              <span class="pick-price">${esc(s.price || "")}</span>
            </button>`
          )
          .join("");
        box.hidden = false;
        list.querySelectorAll(".pick-row").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            closeOverlapPicker();
            selectShop(btn.getAttribute("data-id"), false);
          });
        });
      }
      function handleGroupClick(group) {
        if (group.length === 1) {
          closeOverlapPicker();
          selectShop(group[0].id, false);
          return;
        }
        openOverlapPicker(group);
      }

      function LeafletEngine() {
        this.map = null;
        this.cluster = null;
        this.markers = new Map();
        this.meMarker = null;
        this.circle = null;
      }
      LeafletEngine.prototype.init = function (lat, lng) {
        this.map = L.map("map", { zoomControl: true }).setView([lat, lng], 14);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "&copy; OpenStreetMap",
          maxZoom: 19,
        }).addTo(this.map);
        this.map.on("click", closeOverlapPicker);
      };
      LeafletEngine.prototype.setMyLocation = function (lat, lng, radiusKm) {
        const icon = L.divIcon({ className: "", html: '<div class="my-dot"></div>', iconSize: [16, 16], iconAnchor: [8, 8] });
        if (this.meMarker) this.meMarker.setLatLng([lat, lng]);
        else this.meMarker = L.marker([lat, lng], { icon, zIndexOffset: 1000, title: "내 위치" }).addTo(this.map);
        if (this.circle) {
          this.map.removeLayer(this.circle);
          this.circle = null;
        }
        if (radiusKm && radiusKm !== "all") {
          this.circle = L.circle([lat, lng], {
            radius: Number(radiusKm) * 1000,
            color: "#667eea",
            fillColor: "#667eea",
            fillOpacity: 0.08,
            weight: 2,
          }).addTo(this.map);
        }
        this.map.setView([lat, lng], radiusKm && radiusKm !== "all" ? 14 : this.map.getZoom());
      };
      LeafletEngine.prototype.setShops = function (shops, onSelect) {
        this.markers.forEach((m) => this.map.removeLayer(m));
        this.markers.clear();
        closeOverlapPicker();
        groupOverlapping(shops).forEach((group) => {
          const shop = group[0];
          const ids = group.map((s) => String(s.id));
          const m = L.marker([shop.lat, shop.lng], {
            icon: L.divIcon({
              className: "map-label-icon",
              html: clusterInnerHtml(group, state.selectedId),
              iconSize: group.length > 1 ? [48, 52] : [210, 52],
              iconAnchor: group.length > 1 ? [24, 52] : [105, 52],
            }),
          });
          m.on("click", (e) => {
            if (e && e.originalEvent) L.DomEvent.stopPropagation(e.originalEvent);
            handleGroupClick(group);
          });
          m.addTo(this.map);
          ids.forEach((id) => this.markers.set(id, m));
        });
      };
      LeafletEngine.prototype.focusShop = function (shop) {
        const m = this.markers.get(String(shop.id));
        if (!m) return;
        closeOverlapPicker();
        this.map.setView([shop.lat, shop.lng], 16);
      };
      LeafletEngine.prototype.highlight = function (id) {
        this.markers.forEach((m) => {
          const el = m.getElement();
          if (!el) return;
          const lab = el.querySelector(".map-label, .map-cluster");
          if (lab) lab.classList.remove("is-selected");
        });
        const m = this.markers.get(String(id));
        if (!m) return;
        const el = m.getElement();
        const lab = el && el.querySelector(".map-label, .map-cluster");
        if (lab) lab.classList.add("is-selected");
      };

      function KakaoEngine() {
        this.map = null;
        this.cluster = null;
        this.markers = new Map();
        this.overlays = [];
        this.meMarker = null;
        this.meHalo = null;
        this.circle = null;
        this.info = null;
      }
      KakaoEngine.prototype.init = function (lat, lng) {
        const center = new kakao.maps.LatLng(lat, lng);
        this.map = new kakao.maps.Map(document.getElementById("map"), { center, level: 5 });
        kakao.maps.event.addListener(this.map, "click", closeOverlapPicker);
      };
      KakaoEngine.prototype.setMyLocation = function (lat, lng, radiusKm) {
        const pos = new kakao.maps.LatLng(lat, lng);
        if (this.meMarker) this.meMarker.setPosition(pos);
        else {
          this.meMarker = new kakao.maps.Marker({
            position: pos,
            map: this.map,
            title: "내 위치",
            zIndex: 8,
          });
        }
        if (this.meHalo) {
          this.meHalo.setMap(null);
          this.meHalo = null;
        }
        this.meHalo = new kakao.maps.Circle({
          center: pos,
          radius: 28,
          strokeWeight: 0,
          fillColor: "#2563eb",
          fillOpacity: 0.28,
        });
        this.meHalo.setMap(this.map);
        if (this.circle) {
          this.circle.setMap(null);
          this.circle = null;
        }
        if (radiusKm && radiusKm !== "all") {
          this.circle = new kakao.maps.Circle({
            center: pos,
            radius: Number(radiusKm) * 1000,
            strokeWeight: 2,
            strokeColor: "#667eea",
            strokeOpacity: 0.9,
            fillColor: "#667eea",
            fillOpacity: 0.08,
          });
          this.circle.setMap(this.map);
        }
        this.map.setCenter(pos);
      };
      KakaoEngine.prototype.setShops = function (shops) {
        this.markers.clear();
        this.overlays.forEach((o) => o.setMap(null));
        this.overlays = [];
        closeOverlapPicker();
        groupOverlapping(shops).forEach((group) => {
          const shop = group[0];
          const pos = new kakao.maps.LatLng(shop.lat, shop.lng);
          group.forEach((s) => this.markers.set(String(s.id), pos));

          const node = document.createElement("div");
          node.innerHTML = clusterInnerHtml(group, state.selectedId);
          const label = node.firstElementChild;
          label.dataset.ids = group.map((s) => s.id).join(",");
          label.addEventListener("click", (e) => {
            e.stopPropagation();
            handleGroupClick(group);
          });
          const overlay = new kakao.maps.CustomOverlay({
            map: this.map,
            position: pos,
            content: label,
            yAnchor: 1,
            zIndex: 3,
            clickable: true,
          });
          this.overlays.push(overlay);
        });
      };
      KakaoEngine.prototype.focusShop = function (shop) {
        const pos = this.markers.get(String(shop.id));
        if (!pos) return;
        closeOverlapPicker();
        this.map.setLevel(4);
        this.map.panTo(pos);
      };
      KakaoEngine.prototype.highlight = function (id) {
        this.overlays.forEach((o) => {
          const el = o.getContent();
          if (!el) return;
          const ids = String(el.dataset.ids || el.dataset.id || "").split(",");
          const on = ids.includes(String(id));
          el.classList.toggle("is-selected", on);
          const inner = el.querySelector(".map-label, .map-cluster");
          if (inner) inner.classList.toggle("is-selected", on);
        });
      };
      function matchCat(shop, cat) {
        if (cat === "all") return true;
        const blob = countryBlob(shop);
        const name = String(shop.name || "");
        const type = String(shop.type || "");
        if (cat === "korea") return /korea|한국/.test(blob);
        if (cat === "china") return /china|중국/.test(blob);
        if (cat === "thailand") return /thailand|thai|태국/.test(blob);
        if (cat === "oneshop") return /1인샵/.test(name);
        if (cat === "homecare") {
          return (
            type === "출장마사지" ||
            /홈케어|홈타이|출장/.test(name) ||
            /홈케어|홈타이/.test(String(shop.address || ""))
          );
        }
        return true;
      }
      function shopMatchesTheme(shop, keywords) {
        if (!shop || !keywords || !keywords.length) return false;
        if (Array.isArray(shop.themes)) {
          if (!shop.themes.length) return false;
          const text = shop.themes.map(String).join(" ");
          const lower = text.toLowerCase();
          return keywords.some((k) => {
            const key = String(k);
            return text.includes(key) || lower.includes(key.toLowerCase());
          });
        }
        const parts = [];
        if (shop.type) parts.push(String(shop.type));
        if (Array.isArray(shop.types)) parts.push(shop.types.map(String).join(" "));
        if (Array.isArray(shop.services)) parts.push(shop.services.map(String).join(" "));
        const text = parts.join(" ");
        const lower = text.toLowerCase();
        return keywords.some((k) => {
          const key = String(k);
          return text.includes(key) || lower.includes(key.toLowerCase());
        });
      }
      function matchTheme(shop, theme) {
        if (theme === "all") return true;
        const keywords = THEME_KEYWORDS[theme];
        if (!keywords) return true;
        return shopMatchesTheme(shop, keywords);
      }
      function fmtKm(km) {
        if (!Number.isFinite(km) || km === Infinity) return "";
        if (km < 1) return (km * 1000).toFixed(0) + "m";
        return km.toFixed(1) + "km";
      }

      function visibleShops() {
        const km = state.km === "all" ? Infinity : Number(state.km);
        return state.shops
          .filter(
            (s) =>
              hasCoords(s) &&
              matchCat(s, state.cat) &&
              matchTheme(s, state.theme) &&
              s.distance <= km
          )
          .sort((a, b) => a.distance - b.distance);
      }

      function applyDistances() {
        state.shops.forEach((s) => {
          if (hasCoords(s)) {
            s.distance = haversineKm(state.my.lat, state.my.lng, Number(s.lat), Number(s.lng));
          } else {
            s.distance = Infinity;
          }
        });
      }
      function normArea(s) {
        return String(s || "")
          .replace(/\s+/g, "")
          .replace(/[구시군]$/, "")
          .toLowerCase();
      }
      function areaMatch(value, selected) {
        const a = normArea(value);
        const b = normArea(selected);
        if (!a || !b) return false;
        return a === b || a.includes(b) || b.includes(a);
      }
      function centroidOf(shops) {
        const pts = shops.filter(hasCoords);
        if (!pts.length) return null;
        return {
          lat: pts.reduce((n, s) => n + Number(s.lat), 0) / pts.length,
          lng: pts.reduce((n, s) => n + Number(s.lng), 0) / pts.length,
        };
      }
      function readPlaceQuery() {
        const q = new URLSearchParams(location.search);
        let region = (q.get("region") || "").trim();
        let district = (q.get("district") || "").trim();
        let dong = (q.get("dong") || "").trim();
        if (!region && !district && !dong) {
          try {
            const saved = JSON.parse(
              sessionStorage.getItem("gunmatown-nearby-origin") || "null"
            );
            if (saved && typeof saved === "object") {
              region = String(saved.region || "").trim();
              district = String(saved.district || "").trim();
              dong = String(saved.dong || "").trim();
            }
          } catch {
            /* ignore */
          }
        }
        return { region, district, dong };
      }
      function computePlaceOrigin(shops, sel) {
        if (!sel || (!sel.region && !sel.district && !sel.dong)) return null;
        if (sel.dong) {
          const hit = shops.filter(
            (s) => areaMatch(s.dong, sel.dong) || areaMatch(s.address, sel.dong)
          );
          const c = centroidOf(hit);
          if (c) return { ...c, source: "place", label: sel.dong };
        }
        if (sel.district) {
          const hit = shops.filter((s) => areaMatch(s.district, sel.district));
          const c = centroidOf(hit);
          if (c) return { ...c, source: "place", label: sel.district };
        }
        if (sel.region) {
          const hit = shops.filter(
            (s) =>
              areaMatch(s.region, sel.region) ||
              String(s.region || "").includes(sel.region)
          );
          const c = centroidOf(hit);
          if (c) return { ...c, source: "place", label: sel.region };
        }
        return null;
      }
      function fallbackOrigin() {
        if (state.place) return { ...state.place };
        return { ...SEOUL_STATION, source: "default" };
      }

      function getDetailLine(shop) {
        const address = String(shop.address || "").trim();
        const compact = (s) => String(s || "").replace(/\s+/g, "");
        const sameAddr = (line) => {
          const a = compact(address);
          const b = compact(line);
          if (!a || !b) return false;
          return a === b || a.includes(b) || b.includes(a);
        };
        const boiler = (line) =>
          /^[★☆*]/.test(line) ||
          /부재시|예약제|입실\s*후\s*선불|예약자동취소|100%\s*예약제/.test(line);
        const field = String(shop.detailAddress || "").trim();
        if (field && !sameAddr(field)) return field;
        const lines = String(shop.directions || "")
          .split(/\n+/)
          .map((l) => l.trim())
          .filter(Boolean);
        for (const line of lines) {
          if (boiler(line) || sameAddr(line)) continue;
          if (/상세\s*주소\s*문의|주소\s*문의/.test(line)) continue;
          return line;
        }
        return "";
      }
      function enrichShop(shop) {
        const raw = (window.shopCardData || []).find(
          (x) => String(x.id) === String(shop.id)
        );
        if (!raw) return shop;
        const images = Array.isArray(raw.images) && raw.images.length
          ? raw.images
          : raw.image
            ? [raw.image]
            : shop.image
              ? [shop.image]
              : [];
        return {
          ...shop,
          image: images[0] || shop.image || "",
          images,
          detailAddress: shop.detailAddress || raw.detailAddress || "",
          directions: shop.directions || raw.directions || "",
          services: shop.services || raw.services || [],
          themes: shop.themes || raw.themes,
          type: shop.type || raw.type || "",
        };
      }

      function renderList(list) {
        const box = document.getElementById("shopList");
        const noCoords = state.shops.filter((s) => !hasCoords(s)).length;
        const help =
          noCoords && !list.length
            ? `<div class="help">좌표가 있는 업체가 없습니다. <code>geocode.py</code>에 카카오 REST 키를 넣고 변환하세요.</div>`
            : noCoords
              ? `<div class="help">주소 변환 안 된 업체 ${noCoords}곳은 지도에서 제외됩니다.</div>`
              : "";
        if (!list.length) {
          box.innerHTML = `${help}<h2>업체 0곳</h2><p class="empty">조건에 맞는 업체가 없습니다.</p>`;
          return;
        }
        box.innerHTML =
          help +
          `<h2>${esc(state.my.label || "내 위치")} 기준 가까운 순 ${list.length}곳</h2>` +
          list
            .map((s) => {
              const selected = String(s.id) === String(state.selectedId) ? " is-selected" : "";
              const img = s.image || (s.images && s.images[0]) || "";
              const detail = getDetailLine(s);
              return `<article class="shop-card${selected}" data-id="${esc(s.id)}" id="card-${esc(s.id)}">
                <div class="card-image">${img ? `<img src="${esc(img)}" alt="${esc(s.name)}" width="92" height="118">` : ""}</div>
                <div class="card-body">
                  <div class="row1"><h3><span class="card-flags">${flagImgs(s)}</span><span class="card-name">${esc(s.name)}</span></h3><span class="km">${esc(fmtKm(s.distance))}</span></div>
                  <p>${esc(s.address || "주소 없음")}</p>
                  ${detail ? `<p class="detail-addr">${esc(detail)}</p>` : ""}
                  <p>${esc(s.operatingHours || "영업시간 정보 없음")}</p>
                  <p class="price"><span class="price-label">최저가</span>${esc(s.price || "가격 문의")}</p>
                </div>
              </article>`;
            })
            .join("");
        box.querySelectorAll(".shop-card").forEach((el) => {
          el.addEventListener("click", (e) => {
            if (e.target.closest("a")) return;
            selectShop(el.getAttribute("data-id"), true);
          });
        });
      }

      function selectShop(id, fromList) {
        const shop = state.shops.find((s) => String(s.id) === String(id));
        if (!shop || !hasCoords(shop)) return;
        state.selectedId = shop.id;
        if (fromList) closeOverlapPicker();
        if (state.engine && typeof state.engine.highlight === "function") {
          state.engine.highlight(id);
        }
        document.querySelectorAll(".shop-card").forEach((el) => {
          el.classList.toggle("is-selected", String(el.getAttribute("data-id")) === String(id));
        });
        if (fromList && state.engine) state.engine.focusShop(shop);
        if (!fromList) {
          const card = document.getElementById("card-" + id);
          if (card) card.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
      }

      function refresh() {
        const list = visibleShops();
        if (state.engine) {
          state.engine.setMyLocation(state.my.lat, state.my.lng, state.km);
          state.engine.setShops(list, selectShop);
          if (state.selectedId && !list.some((s) => String(s.id) === String(state.selectedId))) {
            state.selectedId = null;
          }
          if (state.engine.map && typeof state.engine.map.invalidateSize === "function") {
            setTimeout(() => state.engine.map.invalidateSize(), 150);
          }
        }
        renderList(list);
        const src =
          state.my.source === "gps"
            ? "GPS"
            : state.my.source === "place"
              ? state.my.label || "선택지역"
              : "서울역(기본)";
        document.getElementById("status").textContent =
          `기준 ${src} · 가까운 순 ${list.length}곳 / 좌표 ${state.shops.filter(hasCoords).length}곳`;
      }

      function bindUi() {
        document.getElementById("cats").addEventListener("click", (e) => {
          const btn = e.target.closest("button[data-cat]");
          if (!btn) return;
          state.cat = btn.getAttribute("data-cat");
          document.querySelectorAll("#cats button").forEach((b) => b.classList.toggle("active", b === btn));
          refresh();
        });
        document.getElementById("distFilters").addEventListener("click", (e) => {
          const btn = e.target.closest("button[data-km]");
          if (!btn) return;
          state.km = btn.getAttribute("data-km");
          document.querySelectorAll("#distFilters button[data-km]").forEach((b) =>
            b.classList.toggle("active", b === btn)
          );
          refresh();
        });
        const themeToggle = document.getElementById("themeToggle");
        const themeSection = document.getElementById("themeFilterSection");
        function syncThemeToggle() {
          themeToggle.classList.toggle("active", state.themeOpen || state.theme !== "all");
        }
        themeToggle.addEventListener("click", () => {
          state.themeOpen = !state.themeOpen;
          themeSection.hidden = !state.themeOpen;
          syncThemeToggle();
        });
        themeSection.addEventListener("click", (e) => {
          const box = e.target.closest(".theme-box[data-theme]");
          if (!box) return;
          state.theme = box.getAttribute("data-theme");
          themeSection.querySelectorAll(".theme-box").forEach((b) =>
            b.classList.toggle("active", b === box)
          );
          syncThemeToggle();
          refresh();
        });
        document.getElementById("gpsBtn").addEventListener("click", () => locateMe(true));
      }

      function locateMe(forceView) {
        if (!navigator.geolocation) {
          state.my = fallbackOrigin();
          applyDistances();
          refresh();
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            state.my = {
              lat: pos.coords.latitude,
              lng: pos.coords.longitude,
              source: "gps",
              label: "내 위치",
            };
            applyDistances();
            refresh();
            if (forceView && state.engine) {
              state.engine.setMyLocation(state.my.lat, state.my.lng, state.km);
              if (typeof state.engine.map.setView === "function") {
                state.engine.map.setView([state.my.lat, state.my.lng], 14);
              } else if (state.engine.map && typeof kakao !== "undefined") {
                state.engine.map.setLevel(5);
                state.engine.map.panTo(new kakao.maps.LatLng(state.my.lat, state.my.lng));
              }
            }
          },
          () => {
            state.my = fallbackOrigin();
            applyDistances();
            refresh();
          },
          { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
        );
      }

      async function loadShops() {
        const res = await fetch("shops.json");
        if (!res.ok) throw new Error("shops.json 을 읽지 못했습니다.");
        const data = await res.json();
        let shops = Array.isArray(data) ? data : data.shops || [];
        try {
          const token = localStorage.getItem("gunmatown-auth-token") || "";
          const ovRes = await fetch(AUTH_API_BASE + "/api/shops", {
            headers: token ? { authorization: "Bearer " + token } : {},
          });
          if (ovRes.ok) {
            const payload = await ovRes.json();
            const map = new Map();
            (payload.items || []).forEach((item) => {
              if (item && item.data) map.set(String(item.shopId), item.data);
            });
            shops = shops.map((s) => {
              const patch = map.get(String(s.id));
              return patch ? { ...s, ...patch, id: s.id } : s;
            });
          }
        } catch {
          /* 공개 목록만 사용 */
        }
        return shops.map(enrichShop);
      }

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = src;
          s.async = true;
          s.onload = () => resolve();
          s.onerror = () => reject(new Error(src));
          document.head.appendChild(s);
        });
      }

      async function bootMap() {
        const keyOk = KAKAO_JS_KEY && KAKAO_JS_KEY !== "YOUR_KAKAO_JS_KEY";
        if (keyOk) {
          try {
            await loadScript(
              "https://dapi.kakao.com/v2/maps/sdk.js?appkey=" +
                encodeURIComponent(KAKAO_JS_KEY) +
                "&libraries=services,clusterer&autoload=false"
            );
            await new Promise((resolve, reject) => {
              const t = setTimeout(() => reject(new Error("kakao timeout")), 4000);
              kakao.maps.load(() => {
                clearTimeout(t);
                resolve();
              });
            });
            document.getElementById("map").innerHTML = "";
            const engine = new KakaoEngine();
            engine.init(state.my.lat, state.my.lng);
            state.engine = engine;
            return;
          } catch (err) {
            console.warn("카카오맵 로드 실패, OSM으로 전환", err);
            document.getElementById("map").innerHTML = "";
          }
        }
        await loadScript("https://unpkg.com/leaflet@1.9.4/dist/leaflet.js");
        await loadScript("https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js");
        state.engine = new LeafletEngine();
        state.engine.init(state.my.lat, state.my.lng);
      }

      async function main() {
        bindUi();
        try {
          state.shops = await loadShops();
        } catch (err) {
          document.getElementById("shopList").innerHTML =
            `<div class="help">${esc(err.message)} — geocode.py 로 shops.json 을 만들어 주세요.</div>`;
        }
        state.place = computePlaceOrigin(state.shops, readPlaceQuery());
        if (state.place) state.my = { ...state.place };
        await bootMap();
        applyDistances();
        refresh();
        if (!state.place) locateMe(false);
      }
      main();
    </script>
  </body>
</html>
