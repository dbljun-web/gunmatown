<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>주변보기 | 건마타운</title>
    <style>
      :root {
        --purple: #667eea;
        --purple-2: #764ba2;
        --line: #e8e8ee;
        --text: #222;
        --muted: #6b7280;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
        color: var(--text);
        background: #f3f4f6;
      }
      .app {
        max-width: 490px;
        margin: 0 auto;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: #fff;
      }
      header.top {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 14px;
        color: #fff;
        background: linear-gradient(135deg, var(--purple) 0%, var(--purple-2) 100%);
      }
      header.top a {
        color: #fff;
        text-decoration: none;
        font-weight: 800;
        font-size: 1.05rem;
      }
      header.top .gps-btn {
        border: 1px solid rgba(255,255,255,.55);
        background: rgba(255,255,255,.18);
        color: #fff;
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 0.78rem;
        font-weight: 700;
        cursor: pointer;
      }
      .status {
        flex: 0 0 auto;
        padding: 6px 14px;
        font-size: 0.78rem;
        color: #374151;
        background: #f8f9ff;
        border-bottom: 1px solid var(--line);
      }
      nav.cats {
        flex: 0 0 auto;
        display: flex;
        gap: 0;
        overflow-x: auto;
        border-bottom: 1px solid var(--line);
        background: #fff;
        -webkit-overflow-scrolling: touch;
      }
      nav.cats button {
        flex: 1 0 auto;
        min-width: 64px;
        border: 0;
        background: none;
        padding: 12px 8px 10px;
        font-size: 0.86rem;
        font-weight: 700;
        color: #888;
        cursor: pointer;
        border-bottom: 2px solid transparent;
      }
      nav.cats button.active {
        color: var(--purple);
        border-bottom-color: var(--purple);
      }
      .filters {
        flex: 0 0 auto;
        display: flex;
        gap: 6px;
        padding: 8px 12px;
        overflow-x: auto;
        border-bottom: 1px solid var(--line);
      }
      .filters button {
        flex: 0 0 auto;
        border: 1px solid #e9ecef;
        background: #f8f9fa;
        color: #555;
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 0.8rem;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
      }
      .filters button.active {
        background: var(--purple);
        border-color: var(--purple);
        color: #fff;
      }
      #map {
        flex: 0 0 45vh;
        height: 45vh;
        width: 100%;
        background: #dbe4f0;
      }
      .shop-list {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 10px 12px 24px;
        background: #f5f6f8;
      }
      .shop-list h2 {
        margin: 4px 0 10px;
        font-size: 0.92rem;
      }
      .shop-card {
        display: block;
        width: 100%;
        text-align: left;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        margin: 0 0 10px;
        cursor: pointer;
        box-shadow: 0 1px 2px rgba(0,0,0,.04);
      }
      .shop-card.is-selected {
        border-color: var(--purple);
        box-shadow: 0 0 0 2px rgba(102,126,234,.25);
      }
      .shop-card .row1 {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: baseline;
      }
      .shop-card h3 {
        margin: 0;
        font-size: 1rem;
      }
      .shop-card .km {
        color: var(--purple);
        font-weight: 800;
        font-size: 0.88rem;
        white-space: nowrap;
      }
      .shop-card p {
        margin: 4px 0 0;
        font-size: 0.82rem;
        color: var(--muted);
        line-height: 1.35;
      }
      .shop-card .phone {
        color: #2563eb;
        font-weight: 700;
        text-decoration: none;
      }
      .map-label img,
      .iw img {
        width: 22px;
        height: 14px;
        object-fit: cover;
        border-radius: 2px;
        flex-shrink: 0;
      }
      .empty {
        padding: 24px 8px;
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .map-label {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        max-width: 210px;
        padding: 4px 8px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 999px;
        box-shadow: 0 2px 8px rgba(0,0,0,.18);
        font-size: 12px;
        line-height: 1.2;
        white-space: nowrap;
        cursor: pointer;
      }
      .map-label.is-selected {
        border-color: var(--purple);
        box-shadow: 0 0 0 2px rgba(102,126,234,.35);
      }
      .map-label .map-name {
        font-weight: 800;
        max-width: 110px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .map-label .map-price {
        font-weight: 800;
        color: #e11d48;
      }
      .map-label-icon {
        background: none !important;
        border: none !important;
      }
      .iw {
        min-width: 160px;
        max-width: 240px;
        font-size: 13px;
        line-height: 1.35;
      }
      .iw-top {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-bottom: 3px;
      }
      .iw b { font-size: 13px; }
      .iw .iw-price { color: #e11d48; font-weight: 800; }
      .help {
        margin: 0 0 10px;
        padding: 10px 12px;
        background: #fff7ed;
        border: 1px solid #fed7aa;
        border-radius: 10px;
        font-size: 0.8rem;
        color: #9a3412;
      }
      .my-dot {
        width: 16px;
        height: 16px;
        background: #2563eb;
        border: 3px solid #fff;
        border-radius: 50%;
        box-shadow: 0 0 0 6px rgba(37,99,235,.25);
      }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <a href="index.html">건마타운 · 주변보기</a>
        <button type="button" class="gps-btn" id="gpsBtn">내 위치</button>
      </header>
      <div class="status" id="status">위치 확인 중…</div>
      <nav class="cats" id="cats">
        <button type="button" data-cat="all" class="active">전체</button>
        <button type="button" data-cat="korea">한국</button>
        <button type="button" data-cat="china">중국</button>
        <button type="button" data-cat="thailand">태국</button>
        <button type="button" data-cat="oneshop">1인샵</button>
        <button type="button" data-cat="homecare">홈케어</button>
      </nav>
      <div class="filters" id="distFilters">
        <button type="button" data-km="all" class="active">전체</button>
        <button type="button" data-km="1">1km</button>
        <button type="button" data-km="3">3km</button>
        <button type="button" data-km="5">5km</button>
        <button type="button" data-km="10">10km</button>
      </div>
      <div id="map"></div>
      <section class="shop-list" id="shopList"></section>
    </div>

    <script>
      /* 카카오 JavaScript 키. 발급 후 아래 값을 교체하세요.
         1) https://developers.kakao.com 앱 생성
         2) 앱 키 → JavaScript 키 복사
         3) 플랫폼 → Web → 사이트 도메인에 https://gunmatown.com 과 http://localhost:5500 등록
         REST 키는 geocode.py 전용입니다. */
      const KAKAO_JS_KEY = "818ce0b08043e64115b800bc56f88c34";
      const SEOUL_STATION = { lat: 37.5546, lng: 126.9706 };
      const AUTH_API_BASE = (() => {
        try {
          return localStorage.getItem("gunmatown-api-base") || "https://gunmatown-api.pages.dev";
        } catch {
          return "https://gunmatown-api.pages.dev";
        }
      })();

      const state = {
        engine: null,
        my: { ...SEOUL_STATION, source: "default" },
        shops: [],
        cat: "all",
        km: "all",
        selectedId: null,
      };

      function toRad(v) { return (v * Math.PI) / 180; }
      function haversineKm(aLat, aLng, bLat, bLng) {
        const R = 6371;
        const dLat = toRad(bLat - aLat);
        const dLng = toRad(bLng - aLng);
        const h =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(toRad(aLat)) * Math.cos(toRad(bLat)) * Math.sin(dLng / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
      }
      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function hasCoords(s) {
        const lat = Number(s.lat);
        const lng = Number(s.lng);
        return Number.isFinite(lat) && Number.isFinite(lng);
      }
      function countryBlob(shop) {
        return String(shop.country || "").toLowerCase();
      }
      const FLAG_MAP = [
        { key: "korea", re: /korea|한국/, src: "images/national flag/한국.jpg", alt: "한국" },
        { key: "china", re: /china|중국/, src: "images/national flag/중국.jpg", alt: "중국" },
        { key: "thailand", re: /thailand|thai|태국/, src: "images/national flag/태국.jpg", alt: "태국" },
        { key: "japan", re: /japan|일본/, src: "images/national flag/일본.jpg", alt: "일본" },
        { key: "russia", re: /russia|러시아/, src: "images/national flag/러시아.jpg", alt: "러시아" },
        { key: "ukraine", re: /ukraine|우크라이나/, src: "images/national flag/우크라이나국기.png", alt: "우크라이나" },
      ];
      function countryFlags(shop) {
        const blob = countryBlob(shop);
        const hits = FLAG_MAP.filter((f) => f.re.test(blob));
        return hits.length ? hits : [FLAG_MAP[0]];
      }
      function flagImgs(shop) {
        return countryFlags(shop)
          .map((f) => `<img src="${f.src}" alt="${esc(f.alt)}">`)
          .join("");
      }
      function countryLabels(shop) {
        return countryFlags(shop).map((f) => f.alt);
      }
      function locationText(shop) {
        return [shop.district, shop.dong].filter(Boolean).join(" ") || shop.region || "";
      }

      function labelInnerHtml(shop, selected) {
        return `<div class="map-label${selected ? " is-selected" : ""}">
          <span class="map-flags">${flagImgs(shop)}</span>
          <span class="map-name">${esc(shop.name)}</span>
          <span class="map-price">${esc(shop.price || "")}</span>
        </div>`;
      }
      function infoHtml(shop) {
        return `<div class="iw">
          <div class="iw-top">${flagImgs(shop)}<b>${esc(shop.name)}</b></div>
          <div class="iw-price">${esc(shop.price || "가격 문의")}</div>
          <div>${esc(fmtKm(shop.distance))} · ${esc(shop.address || "")}</div>
        </div>`;
      }

      function LeafletEngine() {
        this.map = null;
        this.cluster = null;
        this.markers = new Map();
        this.meMarker = null;
        this.circle = null;
      }
      LeafletEngine.prototype.init = function (lat, lng) {
        this.map = L.map("map", { zoomControl: true }).setView([lat, lng], 14);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "&copy; OpenStreetMap",
          maxZoom: 19,
        }).addTo(this.map);
      };
      LeafletEngine.prototype.setMyLocation = function (lat, lng, radiusKm) {
        const icon = L.divIcon({ className: "", html: '<div class="my-dot"></div>', iconSize: [16, 16], iconAnchor: [8, 8] });
        if (this.meMarker) this.meMarker.setLatLng([lat, lng]);
        else this.meMarker = L.marker([lat, lng], { icon, zIndexOffset: 1000, title: "내 위치" }).addTo(this.map);
        if (this.circle) {
          this.map.removeLayer(this.circle);
          this.circle = null;
        }
        if (radiusKm && radiusKm !== "all") {
          this.circle = L.circle([lat, lng], {
            radius: Number(radiusKm) * 1000,
            color: "#667eea",
            fillColor: "#667eea",
            fillOpacity: 0.08,
            weight: 2,
          }).addTo(this.map);
        }
        this.map.setView([lat, lng], radiusKm && radiusKm !== "all" ? 14 : this.map.getZoom());
      };
      LeafletEngine.prototype.setShops = function (shops, onSelect) {
        this.markers.forEach((m) => this.map.removeLayer(m));
        this.markers.clear();
        shops.forEach((shop) => {
          const selected = String(shop.id) === String(state.selectedId);
          const m = L.marker([shop.lat, shop.lng], {
            icon: L.divIcon({
              className: "map-label-icon",
              html: labelInnerHtml(shop, selected),
              iconSize: [210, 32],
              iconAnchor: [105, 32],
            }),
          });
          m.bindPopup(infoHtml(shop));
          m.on("click", () => onSelect(shop.id, false));
          m.addTo(this.map);
          this.markers.set(String(shop.id), m);
        });
      };
      LeafletEngine.prototype.focusShop = function (shop) {
        const m = this.markers.get(String(shop.id));
        if (!m) return;
        this.map.setView([shop.lat, shop.lng], 16);
        m.openPopup();
      };
      LeafletEngine.prototype.highlight = function (id) {
        this.markers.forEach((m, key) => {
          const el = m.getElement();
          if (!el) return;
          const lab = el.querySelector(".map-label");
          if (lab) lab.classList.toggle("is-selected", key === String(id));
        });
      };

      function KakaoEngine() {
        this.map = null;
        this.cluster = null;
        this.markers = new Map();
        this.overlays = [];
        this.meMarker = null;
        this.meHalo = null;
        this.circle = null;
        this.info = null;
      }
      KakaoEngine.prototype.init = function (lat, lng) {
        const center = new kakao.maps.LatLng(lat, lng);
        this.map = new kakao.maps.Map(document.getElementById("map"), { center, level: 5 });
        this.info = new kakao.maps.InfoWindow({ zIndex: 4 });
      };
      KakaoEngine.prototype.setMyLocation = function (lat, lng, radiusKm) {
        const pos = new kakao.maps.LatLng(lat, lng);
        if (this.meMarker) this.meMarker.setPosition(pos);
        else {
          this.meMarker = new kakao.maps.Marker({
            position: pos,
            map: this.map,
            title: "내 위치",
            zIndex: 8,
          });
        }
        if (this.meHalo) {
          this.meHalo.setMap(null);
          this.meHalo = null;
        }
        this.meHalo = new kakao.maps.Circle({
          center: pos,
          radius: 28,
          strokeWeight: 0,
          fillColor: "#2563eb",
          fillOpacity: 0.28,
        });
        this.meHalo.setMap(this.map);
        if (this.circle) {
          this.circle.setMap(null);
          this.circle = null;
        }
        if (radiusKm && radiusKm !== "all") {
          this.circle = new kakao.maps.Circle({
            center: pos,
            radius: Number(radiusKm) * 1000,
            strokeWeight: 2,
            strokeColor: "#667eea",
            strokeOpacity: 0.9,
            fillColor: "#667eea",
            fillOpacity: 0.08,
          });
          this.circle.setMap(this.map);
        }
        this.map.setCenter(pos);
      };
      KakaoEngine.prototype.setShops = function (shops, onSelect) {
        this.markers.clear();
        this.overlays.forEach((o) => o.setMap(null));
        this.overlays = [];
        shops.forEach((shop) => {
          const pos = new kakao.maps.LatLng(shop.lat, shop.lng);
          this.markers.set(String(shop.id), pos);

          const node = document.createElement("div");
          node.innerHTML = labelInnerHtml(shop, String(shop.id) === String(state.selectedId));
          const label = node.firstElementChild;
          label.dataset.id = String(shop.id);
          label.addEventListener("click", (e) => {
            e.stopPropagation();
            this.info.setContent(infoHtml(shop));
            this.info.setPosition(pos);
            this.info.open(this.map);
            onSelect(shop.id, false);
          });
          const overlay = new kakao.maps.CustomOverlay({
            map: this.map,
            position: pos,
            content: label,
            yAnchor: 1.25,
            zIndex: 3,
            clickable: true,
          });
          this.overlays.push(overlay);
        });
      };
      KakaoEngine.prototype.focusShop = function (shop) {
        const pos = this.markers.get(String(shop.id));
        if (!pos) return;
        this.map.setLevel(4);
        this.map.panTo(pos);
        this.info.setContent(infoHtml(shop));
        this.info.setPosition(pos);
        this.info.open(this.map);
      };
      KakaoEngine.prototype.highlight = function (id) {
        this.overlays.forEach((o) => {
          const el = o.getContent();
          if (el && el.classList) {
            el.classList.toggle("is-selected", String(el.dataset.id) === String(id));
          }
        });
      };
      function matchCat(shop, cat) {
        if (cat === "all") return true;
        const blob = countryBlob(shop);
        const name = String(shop.name || "");
        const type = String(shop.type || "");
        if (cat === "korea") return /korea|한국/.test(blob);
        if (cat === "china") return /china|중국/.test(blob);
        if (cat === "thailand") return /thailand|thai|태국/.test(blob);
        if (cat === "oneshop") return /1인샵/.test(name);
        if (cat === "homecare") {
          return (
            type === "출장마사지" ||
            /홈케어|홈타이|출장/.test(name) ||
            /홈케어|홈타이/.test(String(shop.address || ""))
          );
        }
        return true;
      }
      function fmtKm(km) {
        if (!Number.isFinite(km) || km === Infinity) return "";
        if (km < 1) return (km * 1000).toFixed(0) + "m";
        return km.toFixed(1) + "km";
      }

      function visibleShops() {
        const km = state.km === "all" ? Infinity : Number(state.km);
        return state.shops
          .filter((s) => hasCoords(s) && matchCat(s, state.cat) && s.distance <= km)
          .sort((a, b) => a.distance - b.distance);
      }

      function applyDistances() {
        state.shops.forEach((s) => {
          if (hasCoords(s)) {
            s.distance = haversineKm(state.my.lat, state.my.lng, Number(s.lat), Number(s.lng));
          } else {
            s.distance = Infinity;
          }
        });
      }

      function renderList(list) {
        const box = document.getElementById("shopList");
        const noCoords = state.shops.filter((s) => !hasCoords(s)).length;
        const help =
          noCoords && !list.length
            ? `<div class="help">좌표가 있는 업체가 없습니다. <code>geocode.py</code>에 카카오 REST 키를 넣고 변환하세요.</div>`
            : noCoords
              ? `<div class="help">주소 변환 안 된 업체 ${noCoords}곳은 지도에서 제외됩니다.</div>`
              : "";
        if (!list.length) {
          box.innerHTML = `${help}<h2>업체 0곳</h2><p class="empty">조건에 맞는 업체가 없습니다.</p>`;
          return;
        }
        box.innerHTML =
          help +
          `<h2>가까운 순 ${list.length}곳</h2>` +
          list
            .map((s) => {
              const cat = [s.type, ...countryLabels(s)].filter(Boolean).join(" · ");
              const selected = String(s.id) === String(state.selectedId) ? " is-selected" : "";
              return `<article class="shop-card${selected}" data-id="${esc(s.id)}" id="card-${esc(s.id)}">
                <div class="row1"><h3>${esc(s.name)}</h3><span class="km">${esc(fmtKm(s.distance))}</span></div>
                <p>${esc(s.address || "주소 없음")}</p>
                <p>${esc(s.operatingHours || "영업시간 정보 없음")}</p>
                <p>${esc(cat)}</p>
                <p>${esc(s.price || "가격 문의")}</p>
                <p>${s.phone ? `<a class="phone" href="tel:${esc(s.phone)}">${esc(s.phone)}</a>` : "전화 없음"}</p>
              </article>`;
            })
            .join("");
        box.querySelectorAll(".shop-card").forEach((el) => {
          el.addEventListener("click", (e) => {
            if (e.target.closest("a")) return;
            selectShop(el.getAttribute("data-id"), true);
          });
        });
      }

      function selectShop(id, fromList) {
        const shop = state.shops.find((s) => String(s.id) === String(id));
        if (!shop || !hasCoords(shop)) return;
        state.selectedId = shop.id;
        if (state.engine && typeof state.engine.highlight === "function") {
          state.engine.highlight(id);
        }
        document.querySelectorAll(".shop-card").forEach((el) => {
          el.classList.toggle("is-selected", String(el.getAttribute("data-id")) === String(id));
        });
        if (fromList && state.engine) state.engine.focusShop(shop);
        if (!fromList) {
          const card = document.getElementById("card-" + id);
          if (card) card.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
      }

      function refresh() {
        const list = visibleShops();
        if (state.engine) {
          state.engine.setMyLocation(state.my.lat, state.my.lng, state.km);
          state.engine.setShops(list, selectShop);
          if (state.selectedId && !list.some((s) => String(s.id) === String(state.selectedId))) {
            state.selectedId = null;
          }
          if (state.engine.map && typeof state.engine.map.invalidateSize === "function") {
            setTimeout(() => state.engine.map.invalidateSize(), 150);
          }
        }
        renderList(list);
        const src =
          state.my.source === "gps" ? "GPS" : "서울역(기본)";
        document.getElementById("status").textContent =
          `내 위치 ${src} · 표시 ${list.length}곳 / 좌표 ${state.shops.filter(hasCoords).length}곳`;
      }

      function bindUi() {
        document.getElementById("cats").addEventListener("click", (e) => {
          const btn = e.target.closest("button[data-cat]");
          if (!btn) return;
          state.cat = btn.getAttribute("data-cat");
          document.querySelectorAll("#cats button").forEach((b) => b.classList.toggle("active", b === btn));
          refresh();
        });
        document.getElementById("distFilters").addEventListener("click", (e) => {
          const btn = e.target.closest("button[data-km]");
          if (!btn) return;
          state.km = btn.getAttribute("data-km");
          document.querySelectorAll("#distFilters button").forEach((b) => b.classList.toggle("active", b === btn));
          refresh();
        });
        document.getElementById("gpsBtn").addEventListener("click", () => locateMe(true));
      }

      function locateMe(forceView) {
        if (!navigator.geolocation) {
          state.my = { ...SEOUL_STATION, source: "default" };
          applyDistances();
          refresh();
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            state.my = {
              lat: pos.coords.latitude,
              lng: pos.coords.longitude,
              source: "gps",
            };
            applyDistances();
            refresh();
            if (forceView && state.engine) {
              state.engine.setMyLocation(state.my.lat, state.my.lng, state.km);
            }
          },
          () => {
            state.my = { ...SEOUL_STATION, source: "default" };
            applyDistances();
            refresh();
          },
          { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
        );
      }

      async function loadShops() {
        const res = await fetch("shops.json");
        if (!res.ok) throw new Error("shops.json 을 읽지 못했습니다.");
        const data = await res.json();
        let shops = Array.isArray(data) ? data : data.shops || [];
        try {
          const token = localStorage.getItem("gunmatown-auth-token") || "";
          const ovRes = await fetch(AUTH_API_BASE + "/api/shops", {
            headers: token ? { authorization: "Bearer " + token } : {},
          });
          if (ovRes.ok) {
            const payload = await ovRes.json();
            const map = new Map();
            (payload.items || []).forEach((item) => {
              if (item && item.data) map.set(String(item.shopId), item.data);
            });
            shops = shops.map((s) => {
              const patch = map.get(String(s.id));
              return patch ? { ...s, ...patch, id: s.id } : s;
            });
          }
        } catch {
          /* 공개 목록만 사용 */
        }
        return shops;
      }

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = src;
          s.async = true;
          s.onload = () => resolve();
          s.onerror = () => reject(new Error(src));
          document.head.appendChild(s);
        });
      }

      async function bootMap() {
        const keyOk = KAKAO_JS_KEY && KAKAO_JS_KEY !== "YOUR_KAKAO_JS_KEY";
        if (keyOk) {
          try {
            await loadScript(
              "https://dapi.kakao.com/v2/maps/sdk.js?appkey=" +
                encodeURIComponent(KAKAO_JS_KEY) +
                "&libraries=services,clusterer&autoload=false"
            );
            await new Promise((resolve, reject) => {
              const t = setTimeout(() => reject(new Error("kakao timeout")), 4000);
              kakao.maps.load(() => {
                clearTimeout(t);
                resolve();
              });
            });
            document.getElementById("map").innerHTML = "";
            const engine = new KakaoEngine();
            engine.init(state.my.lat, state.my.lng);
            state.engine = engine;
            return;
          } catch (err) {
            console.warn("카카오맵 로드 실패, OSM으로 전환", err);
            document.getElementById("map").innerHTML = "";
          }
        }
        await loadScript("https://unpkg.com/leaflet@1.9.4/dist/leaflet.js");
        await loadScript("https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js");
        state.engine = new LeafletEngine();
        state.engine.init(state.my.lat, state.my.lng);
      }

      async function main() {
        bindUi();
        try {
          state.shops = await loadShops();
        } catch (err) {
          document.getElementById("shopList").innerHTML =
            `<div class="help">${esc(err.message)} — geocode.py 로 shops.json 을 만들어 주세요.</div>`;
        }
        await bootMap();
        locateMe(false);
        applyDistances();
        refresh();
      }
      main();
    </script>
  </body>
</html>
