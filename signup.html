<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .auth-page { max-width: 430px; margin: 0 auto; min-height: 100vh; background: #fff; padding: 24px 16px 40px; box-sizing: border-box; }
      .auth-page h1 { margin: 0 0 8px; font-size: 1.4rem; }
      .auth-page .auth-sub { margin: 0 0 20px; color: #666; font-size: 0.92rem; }
      .auth-form label { display: block; margin-bottom: 12px; font-weight: 600; font-size: 0.9rem; }
      .auth-form input { width: 100%; margin-top: 6px; padding: 12px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 1rem; }
      .auth-error { color: #c62828; margin: 8px 0 0; font-size: 0.9rem; }
      .auth-submit { width: 100%; margin-top: 16px; padding: 14px; border: 0; border-radius: 10px; background: #e11d68; color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; }
      .auth-switch { text-align: center; margin-top: 16px; color: #666; }
      .auth-back { display: inline-block; margin-bottom: 16px; color: #333; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <main class="auth-page">
      <a class="auth-back" href="index.html">← 홈으로</a>
      <h1>회원가입</h1>
      <p class="auth-sub">아이디 / 닉네임 / 비밀번호를 입력하세요.</p>
      <form class="auth-form" id="signup-form">
        <label>아이디
          <input type="text" name="username" autocomplete="username" required minlength="4" maxlength="20" placeholder="영문/숫자/밑줄 4~20자" />
        </label>
        <label>닉네임
          <input type="text" name="nickname" required minlength="2" maxlength="20" />
        </label>
        <label>비밀번호
          <input type="password" name="password" autocomplete="new-password" required minlength="6" />
        </label>
        <p class="auth-error" id="signup-error" hidden></p>
        <button type="submit" class="auth-submit">회원가입</button>
        <p class="auth-switch">이미 계정이 있으신가요? <a href="login.html">로그인</a></p>
      </form>
    </main>
    <script src="js/auth-api.js"></script>
    <script src="js/admin-mode.js"></script>
    <script>
      document.getElementById('signup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const errorEl = document.getElementById('signup-error');
        const btn = form.querySelector('button[type="submit"]');
        errorEl.hidden = true;
        btn.disabled = true;
        try {
          const user = await signupUser({
            username: form.username.value.trim(),
            nickname: form.nickname.value.trim(),
            password: form.password.value,
          });
          setAdminMode(user.role === 'admin');
          location.href = 'index.html';
        } catch (err) {
          errorEl.textContent = err.message || '회원가입 실패';
          errorEl.hidden = false;
        } finally {
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
