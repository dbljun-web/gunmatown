<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title id="pageTitle">업체 상세 - 마사지사이트</title>
    <meta
      name="description"
      id="pageDescription"
      content="마사지 업체 상세 정보, 가격, 코스, 리뷰를 확인하세요."
    />
    <meta name="keywords" id="pageKeywords" content="마사지, 출장마사지, 업체상세" />
    <meta property="og:type" content="website" />
    <meta property="og:title" id="ogTitle" content="업체 상세 - 마사지사이트" />
    <meta property="og:description" id="ogDescription" content="마사지 업체 상세 정보" />
    <meta property="og:image" id="ogImage" content="" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" id="twitterImage" content="" />
    <link rel="stylesheet" href="css/style.css?v=20260831c" />
    <script type="application/ld+json" id="shopJsonLd"></script>
  </head>
  <body class="detail-page">
    <div class="detail-phone-shell">
      <header id="mainHeader" class="detail-header">
        <button type="button" class="detail-back-btn" onclick="goBack()"><span class="detail-back-arrow" aria-hidden="true">←</span> 목록으로</button>
        <div class="detail-header-actions">
          <div class="detail-admin-actions" data-admin-only hidden>
            <button type="button" id="adminEditBtn" class="detail-admin-btn">수정</button>
            <button type="button" id="adminDeleteBtn" class="detail-admin-btn detail-admin-btn--danger">삭제</button>
          </div>
          <button
            class="hamburger-btn detail-hamburger"
            onclick="toggleSideMenu()"
            type="button"
            id="hamburgerToggleBtn"
            aria-label="전체 메뉴 열기"
            aria-controls="sideMenu"
            aria-expanded="false"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="18" height="18" fill="currentColor"><path d="M16 132h416c8.837 0 16-7.163 16-16V76c0-8.837-7.163-16-16-16H16C7.163 60 0 67.163 0 76v40c0 8.837 7.163 16 16 16zm0 160h416c8.837 0 16-7.163 16-16v-40c0-8.837-7.163-16-16-16H16c-8.837 0-16 7.163-16 16v40c0 8.837 7.163 16 16 16zm0 160h416c8.837 0 16-7.163 16-16v-40c0-8.837-7.163-16-16-16H16c-8.837 0-16 7.163-16 16v40c0 8.837 7.163 16 16 16z"></path></svg>
          </button>
        </div>
      </header>

      <main class="main-content detail-main">
        <article class="shop-detail">
          <div class="detail-gallery" id="detailGallery">
            <div class="card-image detail-gallery-main" id="detailGalleryMain">
              <img id="shopImage" class="shop-image" alt="업체 이미지" />
              <div class="image-overlay">
                <div id="shopType" class="shop-type shop-type-healing"></div>
                <div id="shopTypeOutcall" class="shop-type shop-type-outcall" hidden>출장샵</div>
              </div>
              <button type="button" class="detail-gallery-nav detail-gallery-nav--prev" id="galleryPrevBtn" aria-label="이전 사진" hidden>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M34.5 239L285.1 41.1c8.7-6.9 21.1-.7 21.1 10.1v409.7c0 10.8-12.4 17-21.1 10.1L34.5 273c-7.9-6.3-7.9-17.7 0-24z"/></svg>
              </button>
              <button type="button" class="detail-gallery-nav detail-gallery-nav--next" id="galleryNextBtn" aria-label="다음 사진" hidden>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M285.5 273L34.9 470.9c-8.7 6.9-21.1.7-21.1-10.1V51.1c0-10.8 12.4-17 21.1-10.1L285.5 239c7.9 6.3 7.9 17.7 0 24z"/></svg>
              </button>
              <div class="detail-gallery-counter" id="galleryCounter" hidden>1 / 1</div>
            </div>
            <div id="shopImageThumbs" class="detail-gallery-thumbs" hidden aria-hidden="true"></div>
          </div>

          <div id="galleryLightbox" class="gallery-lightbox" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="사진 전체보기">
            <div class="gallery-lightbox-backdrop" data-lightbox-close></div>
            <div class="gallery-lightbox-panel">
              <header class="gallery-lightbox-header">
                <span id="galleryLightboxTitle">사진</span>
                <button type="button" class="gallery-lightbox-close" data-lightbox-close aria-label="닫기">&times;</button>
              </header>
              <div class="gallery-lightbox-list" id="galleryLightboxList"></div>
            </div>
          </div>

          <div class="detail-body">
            <h1 id="shopName" class="shop-name"></h1>
            <div class="shop-location-info">
              <span id="shopDistrict" class="shop-district"></span>
              <span id="shopCountryFlags" class="location-flag"></span>
            </div>
            <div class="rating-row" style="display: none">
              <span id="shopStars"></span>
              <span id="shopRatingText"></span>
            </div>

            <nav class="detail-tabs" data-detail-tabs aria-label="상세 메뉴">
              <div class="detail-tabs-inner">
                <button type="button" class="detail-tab is-active" data-tab-target="sectionPrice">가격</button>
                <button type="button" class="detail-tab" data-tab-target="sectionLocation">위치</button>
                <button type="button" class="detail-tab" data-tab-target="sectionIntro">업체소개</button>
                <button type="button" class="detail-tab" data-tab-target="sectionReviews">후기</button>
              </div>
            </nav>

            <section class="detail-section">
              <h2 class="detail-section-title">기본 정보</h2>
              <div class="info-item info-item--icon" id="shopAddress"></div>
              <div class="info-item info-item--icon">
                <img class="info-icon" src="images/icons/phone.svg" alt="전화" width="20" height="20" />
                <span id="shopPhone"></span>
              </div>
              <div class="info-item info-item--icon">
                <img class="info-icon" src="images/icons/clock.svg" alt="운영시간" width="20" height="20" />
                <span id="shopHours"></span>
              </div>
            </section>

            <section id="sectionPrice" class="courses-section detail-section">
              <div class="courses-card">
                <div class="courses-card-header">
                  <span class="courses-icon" aria-hidden="true">💅</span>
                  <h2 class="courses-title">코스 · 가격</h2>
                  <div class="price-mode-toggle" role="group" aria-label="가격 기준">
                    <button type="button" class="price-mode-btn is-active" data-price-mode="member">회원가</button>
                    <button type="button" class="price-mode-btn" data-price-mode="original">기존가</button>
                  </div>
                </div>
                <div id="coursesList" class="courses-table-wrap"></div>
              </div>
            </section>

            <section id="sectionLocation" class="directions-section detail-section" style="display: none">
              <div class="directions-card">
                <div class="directions-card-header">
                  <span class="directions-icon" aria-hidden="true">📍</span>
                  <h2 class="directions-title">오시는 길</h2>
                </div>
                <ul id="shopDirections" class="directions-list"></ul>
              </div>
            </section>

            <section id="sectionIntro" class="detail-section detail-intro-section">
              <h2 class="detail-section-title">업체소개</h2>
              <p id="shopDescription" class="detail-description"></p>
              <div id="staffInfo"></div>
            </section>

            <section id="sectionReviews" class="detail-section reviews-section">
              <h2 class="detail-section-title">후기</h2>
              <div id="reviewsList" class="reviews-list"></div>
            </section>

            <section class="detail-section detail-nearby">
              <div class="nearby-section-head">
                <h2 class="detail-section-title nearby-section-title">
                  <span id="nearbyShopsDistrict"></span>
                  <span class="nearby-section-suffix">다른 샵</span>
                </h2>
                <a href="#" id="nearbyShopsTitleClickable" class="nearby-more-btn">
                  <span id="nearbyShopsTitle">다른샵보기</span>
                </a>
              </div>
              <div id="nearbyShopsList" class="nearby-shops-list"></div>
            </section>
          </div>
        </article>
      </main>

      <section class="booking-section detail-action-bar" aria-label="업체 바로가기">
        <div class="booking-container">
          <div class="booking-actions">
            <button type="button" onclick="callShop()" class="call-btn">전화하기</button>
            <button type="button" onclick="openMap()" class="map-btn detail-map-btn">지도보기</button>
            <button type="button" onclick="shareShop()" class="share-action-btn">공유</button>
          </div>
        </div>
      </section>
    </div>

    <div id="hamburger-menu-container"></div>

    <script src="js/shop-card-data.js"></script>
    <script src="js/auth-api.js"></script>
    <script src="js/admin-mode.js"></script>
    <script src="js/shop-overrides.js"></script>
    <script src="js/common-components.js"></script>
    <script src="js/detail.js"></script>
  </body>
</html>
